<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口袋教练｜一步一步学德州扑克</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#19372f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:22px max(24px,calc((100% - 960px)/2));background:#153b30;color:white;font-weight:800;letter-spacing:.08em}header span{color:#edc882}main{max-width:960px;margin:auto;padding:46px 24px}h1{font-size:clamp(34px,6vw,54px);line-height:1.15;margin:12px 0}p{line-height:1.8;color:#4f685d}.intro{max-width:680px;margin-bottom:30px}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.panel{background:white;border:1px solid #dce7dd;border-radius:18px;padding:28px;box-shadow:0 8px 30px #183d2e0a}.progress{font-size:13px;font-weight:700;color:#608375}.bar{height:6px;background:#e9eee9;border-radius:8px;margin:12px 0 30px}.fill{height:100%;background:#d4a958;border-radius:8px;transition:width .2s}h2{font-size:27px;line-height:1.35;margin:0 0 10px}h3{font-size:18px;margin:0 0 12px}.hint{font-size:15px}.options{display:grid;gap:10px;margin:24px 0}.option{width:100%;text-align:left;background:#f7faf6;color:#21483a;border:1px solid #d6e5d8;padding:15px;border-radius:10px;font:inherit;cursor:pointer}.option:hover,.option:focus-visible{border-color:#337b59;background:#edf6ed}.option strong{display:block}.option small{display:block;margin-top:5px;line-height:1.5;color:#61796e}.controls{display:flex;gap:10px;flex-wrap:wrap}button.nav{padding:10px 16px;background:#fff;color:#27503f;border:1px solid #bfd0c0;border-radius:8px;cursor:pointer;font:inherit}aside{background:#e4eee2!important}aside p{font-size:14px}aside dl{margin:0}dt{font-weight:700;margin-top:18px}dd{margin:5px 0;color:#4f685d;font-size:14px;line-height:1.7}.notice{font-size:13px;margin-top:24px}.answer{background:#f2f7ef;padding:18px;border-radius:12px;margin:20px 0}.answer strong{color:#9b7027}.answer ul{padding-left:20px;line-height:1.8}details{margin-top:25px}summary{cursor:pointer;font-weight:700}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:30px 16px}.panel{padding:22px}}
</style></head><body><header>♠ 口袋<span>教练</span> <small> / 德州扑克入门</small></header><main><div class="intro"><p>慢慢来，一次只看一个问题</p><h1>先看懂牌局，<br>再决定怎么做。</h1><p>按照真实牌桌上的顺序，选择你看到的情况。每一步右侧都有词语解释，不确定时可以随时返回修改。</p></div><div class="layout"><section class="panel" aria-live="polite"><div class="progress" id="progress"></div><div class="bar"><div class="fill" id="fill"></div></div><div id="content"></div><div class="controls"><button class="nav" id="back">← 上一步</button><button class="nav" id="restart">重新开始</button></div></section><aside class="panel"><h3>📖 这一步的词语</h3><dl id="terms"></dl></aside></div><details><summary>先了解一手牌怎么进行</summary><p>每人先拿到两张只有自己能看的底牌。之后桌面依次发出三张、再一张、再一张公共牌。每次发牌前后，玩家都有机会行动。最后仍未弃牌的玩家比较牌力。</p></details><p class="notice">本页面提供简化的初学者思路，不计算胜率，也不保证盈利。实际决策还取决于具体牌面、下注大小、筹码数量和对手的行动。理性游戏。</p></main><script>
const steps=[{key:'players',title:'第 1 步：桌上一共有几个人？',hint:'把你自己也算进去。人数不同，起手时需要的谨慎程度也不同。',options:[['2','2 人','只有你和另一位玩家'],['3','3–5 人','人数较少'],['6','6 人','常见的六人桌'],['7','7–10 人','人数较多']],terms:[['牌桌人数','正在参与这一手牌的玩家人数，包括你自己。']]},{key:'street',title:'第 2 步：桌面上有几张公共牌？',hint:'只数所有人都能使用的桌面牌，不要数手里的两张牌。',options:[['pre','0 张','刚拿到底牌，称为翻牌前'],['flop','3 张','称为翻牌'],['turn','4 张','称为转牌'],['river','5 张','称为河牌']],terms:[['底牌','发给你、通常只有你自己能看的两张牌。'],['公共牌','放在桌面上，所有玩家都可以用来组合牌型的牌。'],['翻牌、转牌、河牌','依次指前三张公共牌、第四张公共牌和第五张公共牌出现后的阶段。']]},{key:'position',title:'第 3 步：你大概什么时候行动？',hint:'看这一轮里，你是在其他人之前还是之后行动。如果不确定，可以先选“不确定”。',options:[['early','比较早','后面还有不少人没有行动'],['middle','中间','有人已经行动，也有人还没行动'],['late','比较晚','大多数人已经行动'],['unknown','不确定','跳过位置判断']],terms:[['行动','轮到你时选择过牌、下注、跟注、加注或弃牌。'],['位置','相对于其他玩家的行动顺序。行动较晚时，可以先看到更多人的选择。']]},{key:'action',title:'第 4 步：这一轮有人下注吗？',hint:'观察这轮你行动之前，是否有人已经放入筹码。',options:[['none','没有','目前没有需要跟上的下注'],['small','有，跟上要付的钱不超过底池的一半','例如底池 100，跟注需要付 50 或更少'],['large','有，跟上要付的钱超过底池的一半','例如底池 100，跟注需要付 60'],['unknown','不确定','跳过下注大小判断']],terms:[['下注','主动放入筹码，要求其他人决定是否继续。'],['底池','牌桌中央已经放入、供这手牌赢家争夺的筹码总额。'],['跟注','放入足够的筹码，达到当前需要跟上的金额。']]},{key:'strength',title:'第 5 步：你觉得自己的牌怎么样？',hint:'这是粗略自评，不确定就选“不确定”。牌力会随公共牌和对手行动改变。',options:[['strong','可能很强','例如翻牌前拿到 AA，或翻牌后拿到三条；仍要看具体牌面'],['medium','可能中等','例如翻牌后用一张底牌组成一对，且这对与桌面最高点数相同'],['weak','目前较弱','还没有明显的强牌，可能正在等待有用的公共牌'],['unknown','不确定','先学习判断思路']],terms:[['对子','两张点数相同的牌，例如两张 K。'],['三条','三张点数相同的牌，例如三张 8。'],['听牌','目前还没组成目标牌型，但未来的公共牌可能帮你组成，例如还差一张牌凑成同花。'],['牌力','你的五张最佳组合相对于对手可能持有的牌有多强；不能只看牌型名称。']]}];let index=0,answers={};const content=document.getElementById('content'),terms=document.getElementById('terms');function render(){const done=index===steps.length;document.getElementById('progress').textContent=done?'完成 · 回顾你的思路':'步骤 '+(index+1)+' / '+steps.length;document.getElementById('fill').style.width=(done?100:(index+1)/steps.length*100)+'%';document.getElementById('back').disabled=index===0;if(!done){let st=steps[index];content.innerHTML='<h2>'+st.title+'</h2><p class="hint">'+st.hint+'</p><div class="options">'+st.options.map(([v,t,d])=>'<button class="option" data-value="'+v+'"><strong>'+t+'</strong><small>'+d+'</small></button>').join('')+'</div>';terms.innerHTML=st.terms.map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('');content.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[st.key]=b.dataset.value;index++;render()});return}let {players,street,position,action,strength}=answers;let advice;if(action==='unknown'||strength==='unknown')advice='先不要急着决定。确认需要跟多少筹码，并弄清自己的牌型；信息不足时，本工具无法给出有意义的行动提示。';else if(action==='none')advice=strength==='strong'?'可以考虑下注，让可能持有较弱牌的对手继续投入筹码。':'可以先考虑过牌，免费保留继续观察的机会；是否下注还要看具体牌面和对手。';else if(strength==='strong')advice='可以考虑跟注或加注，但强牌也不是一定要全下。先观察对手下注大小和桌面可能组成的牌型。';else if(strength==='medium'&&action==='small')advice='可以谨慎考虑跟注；先想想对手可能有什么牌，以及后面是否还可能面对下注。';else advice='可以优先考虑弃牌。特别是面对较大下注时，不必因为已经投入筹码而勉强继续。听牌是否值得跟注需要进一步计算。';let people=+players>=7?'人数较多时，通常要更谨慎：其他人中出现强牌的机会更高。':+players===2?'两人对局中，盲注轮转更快，通常需要参与更多牌局。':'人数较少时仍要结合位置和对手行动，避免只看自己的牌。';let pos=position==='early'?'行动较早时，后面还有人没表态，通常需要更谨慎。':position==='late'?'行动较晚时，先利用已经看到的信息，再做决定。':'注意还有谁没有行动，不确定位置时不要把位置当作决策依据。';let stage=street==='river'?'现在已经没有后续公共牌，未完成的听牌不会再改善。':street==='pre'?'翻牌前先结合底牌和行动顺序；AA 等大对子通常较强。':'公共牌变化后，要重新评估对子、三条、同花和顺子等可能性。';content.innerHTML='<h2>先这样思考</h2><div class="answer"><strong>建议方向</strong><p>'+advice+'</p></div><h3>接着检查这三点</h3><ul><li>'+people+'</li><li>'+pos+'</li><li>'+stage+'</li></ul><p class="hint">这只是根据你的自评给出的简化提示，并未识别具体手牌。可以返回上一步修改答案。</p>';terms.innerHTML='<dt>过牌</dt><dd>当前没有需要跟上的下注时，暂时不下注，把行动交给下一位玩家。</dd><dt>弃牌</dt><dd>放弃这一手牌，不再争夺底池。</dd><dt>加注</dt><dd>在已有下注的基础上提高金额，让其他人决定是否继续。</dd><dt>全下</dt><dd>把自己剩余的筹码全部投入这一手牌。</dd>'}document.getElementById('back').onclick=()=>{if(index>0){index--;render()}};document.getElementById('restart').onclick=()=>{index=0;answers={};render()};render();
</script></body></html>
